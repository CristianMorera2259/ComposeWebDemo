name: CI

# Primero se define CUANDO se hará, en este caso push en main
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  packages: write

# los jobs son trabajos por hacer
jobs:
  # test correrá en Ubuntu y Java 25 las pruebas unitarias con gradle
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew :shared:wasmJsTest --no-daemon

# Luego va el trabajo de publicar, este requiere que test termine
# Lo que hace es subir a ghcr.io la imagen de docker para que
# En el VPS u otro PC la puedan descargar
# Watchtower es encargado de estar verificando las nuevas versiones
# y actualizar los contenedores de forma automática.

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/cristianmorera2259/composewebdemo:latest